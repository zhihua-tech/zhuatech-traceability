<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>.bg{fill:#f3f5f4}.side{fill:#173642}.nav{font:15px sans-serif;fill:#dce8e8}.brand{font:bold 24px sans-serif;fill:white}.h1{font:bold 28px sans-serif;fill:#173642}.sub{font:14px sans-serif;fill:#64737a}.card{fill:white;stroke:#dce3e4}.small{font:11px sans-serif;fill:#6c7d84}.title{font:bold 18px sans-serif;fill:#203942}.muted{font:12px sans-serif;fill:#728087}.metric{font:bold 30px sans-serif;fill:#1a5963}</style><rect width="1200" height="700" class="bg"/><rect width="270" height="700" class="side"/><text x="42" y="70" class="brand">ZH 知华科技</text><text x="42" y="105" class="nav">TRACE ENTERPRISE</text><text x="48" y="190" class="nav">批次管理</text><text x="48" y="230" class="nav">序列号管理</text><text x="48" y="270" class="nav">产品谱系</text><text x="48" y="310" class="nav">生产事件</text><text x="48" y="350" class="nav">质量记录</text><text x="48" y="390" class="nav">物流追踪</text><text x="320" y="70" class="h1">产品全链路追溯系统 · 运营总览</text><text x="320" y="102" class="sub">用批次、序列号和事件链打通原料、生产、质量、仓储与销售</text><g transform="translate(320,135)"><rect width="780" height="80" rx="12" class="card"/><text x="24" y="30" class="small">企业业务控制中心</text><text x="24" y="62" class="metric">模块 9 · 状态流转 · 风险 · SLA · 审计</text></g><g transform="translate(320,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">LOT</text><text x="20" y="70" class="title">批次管理</text><text x="20" y="96" class="muted">统一原料、半成品和成品批次规则</text></g><g transform="translate(590,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">SERIAL</text><text x="20" y="70" class="title">序列号管理</text><text x="20" y="96" class="muted">管理单品身份、包装层级和状态</text></g><g transform="translate(860,250)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">GENEALOGY</text><text x="20" y="70" class="title">产品谱系</text><text x="20" y="96" class="muted">关联投入批次、工序、设备和产出</text></g><g transform="translate(320,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">PRODUCTION_EVENT</text><text x="20" y="70" class="title">生产事件</text><text x="20" y="96" class="muted">采集投料、加工、返工和报废事件</text></g><g transform="translate(590,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">INSPECTION</text><text x="20" y="70" class="title">质量记录</text><text x="20" y="96" class="muted">绑定检验、放行、不合格和处置结果</text></g><g transform="translate(860,400)"><rect width="240" height="120" rx="12" class="card"/><text x="20" y="38" class="small">LOGISTICS</text><text x="20" y="70" class="title">物流追踪</text><text x="20" y="96" class="muted">记录库位、装箱、发运和签收节点</text></g><text x="320" y="655" class="sub">界面示意 · 上海如静知华信息科技有限公司 · https://www.zhuatech.cn/</text></svg>